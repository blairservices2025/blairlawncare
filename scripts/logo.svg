<!--
  Blair Lawn Care — the logo mark, on its own.

  The full logo sets the wordmark under the two peaks, but a home-screen
  icon is about 60pt across and the phone already prints "Blair Lawn Care"
  underneath it. Type at that size is a smudge, so the icon is the mark
  alone: two overlapping peaks on the bone ground.

  The peaks clear the rounded corners iOS cuts. Android crops harder, so
  make-icons.mjs shrinks this onto more bone for the maskable copy rather
  than making every icon smaller to suit the worst case.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Used to tint just the sliver where the two peaks cross. -->
    <clipPath id="back-peak">
      <path d="M190 379 L315 133 L440 379 Z" />
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#f6f3ea" />

  <!-- Tall peak, behind and to the right. -->
  <path d="M190 379 L315 133 L440 379 Z" fill="#1e3a2e" />

  <!-- Shorter peak, in front and to the left. -->
  <path d="M72 379 L197 164 L322 379 Z" fill="#7cae5b" />

  <!-- The overlap reads as a third, middle green so the peaks have depth. -->
  <g clip-path="url(#back-peak)">
    <path d="M72 379 L197 164 L322 379 Z" fill="#5c8c3e" />
  </g>
</svg>
